# Single-instance Splunk Enterprise for the detection lab.
# Starting this accepts the Splunk General Terms (see SPLUNK_GENERAL_TERMS below).
# Secrets come from .env (copy .env.example). Ports are bound to localhost only.
services:
  splunk:
    image: splunk/splunk:10.4.3
    platform: linux/amd64   # no arm64 image; runs under Rosetta on Apple Silicon
    hostname: splunk-lab
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"   # web UI
      - "127.0.0.1:8088:8088"   # HTTP Event Collector
      - "127.0.0.1:8089:8089"   # management / REST API
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    restart: unless-stopped

volumes:
  splunk-var:
  splunk-etc:
